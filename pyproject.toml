[project]
name = "driftsagent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.19",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests", "ci"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "api*"]

[tool.ruff]
line-length = 100
